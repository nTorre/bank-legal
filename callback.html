<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autorizzazione completata — Bank</title>
<link rel="stylesheet" href="style.css">
<style>
  .box { border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem 1.3rem; margin: 1.5rem 0; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9rem; word-break: break-all; background: var(--code-bg); padding: 0.8rem; border-radius: 6px; display: block; margin-top: 0.6rem; }
  button { font: inherit; padding: 0.5rem 1rem; border-radius: 7px; border: 1px solid var(--border); background: var(--code-bg); color: var(--fg); cursor: pointer; margin-top: 0.8rem; }
  button:hover { border-color: var(--accent); }
  .err { color: #c0392b; }
  @media (prefers-color-scheme: dark) { .err { color: #ff7b6b; } }
</style>
</head>
<body>
<main>

<h1>Autorizzazione completata</h1>
<p class="updated">Bank &middot; pagina di reindirizzamento</p>

<div id="out"></div>

<div class="box">
  <strong>Nota sulla riservatezza</strong>
  <p style="margin-bottom:0">Questa pagina è completamente statica. Il codice di autorizzazione resta nel tuo browser: non viene inviato ad alcun server, non viene registrato e non lascia questo dispositivo.</p>
</div>

<footer>
  <a href="./">Home</a>
  <a href="privacy.html">Privacy</a>
  <a href="terms.html">Termini di servizio</a>
</footer>

</main>

<script>
(function () {
  var APP_SCHEME = "io.ntorre.bank://callback";
  var params = new URLSearchParams(window.location.search);
  var code = params.get("code");
  var error = params.get("error");
  var out = document.getElementById("out");

  function el(html) { var d = document.createElement("div"); d.innerHTML = html; return d; }

  if (error) {
    out.appendChild(el(
      '<p class="err"><strong>Autorizzazione non riuscita</strong></p>' +
      '<p>La banca ha restituito l\'errore: <code>' + error.replace(/[<>&]/g, "") + '</code></p>' +
      '<p>Puoi chiudere questa finestra e riprovare dall\'applicazione.</p>'
    ));
    return;
  }

  if (!code) {
    out.appendChild(el(
      '<p>Questa pagina riceve l\'esito dell\'autorizzazione bancaria e lo restituisce all\'applicazione Bank.</p>' +
      '<p>Aperta direttamente non contiene alcun dato: raggiungila attraverso il flusso di autorizzazione dell\'app.</p>'
    ));
    return;
  }

  out.appendChild(el(
    '<p>Puoi tornare all\'applicazione <strong>Bank</strong>. Se non si è aperta automaticamente, copia il codice qui sotto e incollalo nell\'app.</p>' +
    '<div class="box"><strong>Codice di autorizzazione</strong>' +
    '<code class="code" id="code"></code>' +
    '<button id="copy">Copia negli appunti</button></div>'
  ));

  document.getElementById("code").textContent = code;

  document.getElementById("copy").addEventListener("click", function () {
    var btn = this;
    navigator.clipboard.writeText(code).then(function () {
      btn.textContent = "Copiato";
      setTimeout(function () { btn.textContent = "Copia negli appunti"; }, 2000);
    });
  });

  // Rimbalzo verso l'app nativa tramite custom URL scheme.
  window.location.href = APP_SCHEME + "?" + window.location.search.replace(/^\?/, "");
})();
</script>
</body>
</html>
